<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cinéma privé</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<meta name="theme-color" content="#fff8ef">
<style>
  :root{
    --bg:#fff8ef;
    --surface:#fff;
    --surface-2:#fff1e0;
    --ink:#1c1030;
    --muted:#7c6b8f;
    --line:rgba(28,16,48,.09);
    --radius:14px;
    --pink:#ff3d81;
    --blue:#17c3ff;
    --yellow:#ffcb3d;
    --purple:#8b2ff7;
    --green:#00d68f;
    --orange:#ff7a3d;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    position:relative;
    overflow-x:hidden;
    contain:strict;
  }
  ::selection{background:var(--pink);color:#fff}
  a{color:inherit}
  /* Floating blobs - optimized with will-change and reduced blur */
  .blob{
    position:fixed;
    border-radius:50%;
    filter:blur(40px);
    opacity:.35;
    z-index:0;
    pointer-events:none;
    will-change:transform;
  }
  .blob-1{width:420px;height:420px;top:-140px;left:-120px;background:var(--pink);animation:drift1 22s ease-in-out infinite}
  .blob-2{width:380px;height:380px;top:20%;right:-160px;background:var(--blue);animation:drift2 26s ease-in-out infinite}
  .blob-3{width:340px;height:340px;bottom:-140px;left:30%;background:var(--yellow);animation:drift3 20s ease-in-out infinite}
  .blob-4{width:300px;height:300px;bottom:10%;right:10%;background:var(--purple);opacity:.25;animation:drift1 30s ease-in-out infinite reverse}
  @keyframes drift1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(60px,40px) scale(1.15)}}
  @keyframes drift2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-50px,60px) scale(.9)}}
  @keyframes drift3{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(40px,-50px) scale(1.1)}}
  @media (prefers-reduced-motion:reduce){.blob{animation:none!important}}

  /* Reels - optimized animation */
  .reel-rail{
    position:fixed;
    top:0;bottom:0;
    width:24px;
    background:linear-gradient(180deg,var(--pink),var(--purple),var(--blue),var(--green),var(--yellow),var(--pink));
    background-size:100% 300%;
    animation:railflow 12s linear infinite;
    z-index:1;
    opacity:.85;
    -webkit-mask:radial-gradient(circle,transparent 6px,#000 6.4px);
    -webkit-mask-size:24px 40px;
    -webkit-mask-repeat:repeat-y;
    mask:radial-gradient(circle,transparent 6px,#000 6.4px);
    mask-size:24px 40px;
    mask-repeat:repeat-y;
    will-change:background-position;
  }
  @keyframes railflow{0%{background-position-y:0%}100%{background-position-y:300%}}
  .reel-rail.left{left:0}
  .reel-rail.right{right:0}
  @media (max-width:820px){.reel-rail{display:none}}
  @media (prefers-reduced-motion:reduce){.reel-rail{animation:none}}

  /* Marquee - optimized */
  .marquee{
    position:relative;
    padding:44px 60px 30px;
    text-align:center;
    border-bottom:1px solid var(--line);
    overflow:hidden;
    z-index:2;
    contain:content;
  }
  .marquee::before,.marquee::after{
    content:"";
    position:absolute;
    left:26px;right:26px;
    height:5px;
    background-image:radial-gradient(circle,var(--pink) 2px,transparent 2.2px 8px,var(--blue) 8.2px 10px,transparent 10.2px 16px,var(--yellow) 16.2px 18px,transparent 18.2px 22px);
    background-size:22px 5px;
    opacity:.9;
    will-change:background-position;
  }
  .marquee::before{top:14px;animation:chase 1.1s linear infinite}
  .marquee::after{bottom:14px;animation:chase 1.1s linear infinite reverse}
  @keyframes chase{0%{background-position-x:0}100%{background-position-x:22px}}
  @media (prefers-reduced-motion:reduce){.marquee::before,.marquee::after{animation:none}}
  .marquee-eyebrow{
    font-family:'JetBrains Mono',monospace;
    font-size:.72rem;
    letter-spacing:.3em;
    text-transform:uppercase;
    color:var(--purple);
    font-weight:600;
    margin:0 0 8px;
  }
  .marquee h1{
    font-family:'Bebas Neue',sans-serif;
    font-size:clamp(2.8rem,7.5vw,5.2rem);
    letter-spacing:.09em;
    margin:0;
    background:linear-gradient(90deg,var(--pink),var(--purple),var(--blue),var(--green),var(--yellow),var(--pink));
    background-size:300% 100%;
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    animation:hueflow 8s linear infinite;
    will-change:background-position;
  }
  @keyframes hueflow{0%{background-position-x:0%}100%{background-position-x:300%}}
  @media (prefers-reduced-motion:reduce){.marquee h1{animation:none;background-position-x:0%}}
  .marquee p{
    margin:10px 0 0;
    color:var(--muted);
    font-size:.98rem;
    letter-spacing:.02em;
    font-weight:500;
  }

  /* Controls - optimized */
  .controls{
    max-width:1180px;
    margin:0 auto;
    padding:30px 40px 6px;
    display:flex;
    flex-direction:column;
    gap:18px;
    position:relative;
    z-index:2;
  }
  .search-row{display:flex;gap:12px}
  .search-row input{
    flex:1;
    background:var(--surface);
    border:2px solid var(--line);
    border-radius:12px;
    padding:13px 18px;
    color:var(--ink);
    font-family:'Inter',sans-serif;
    font-size:.95rem;
    outline:none;
    transition:border-color .2s,box-shadow .2s,transform .2s;
  }
  .search-row input:focus{
    border-color:var(--pink);
    box-shadow:0 0 0 4px rgba(255,61,129,.15);
    transform:translateY(-1px);
  }
  .search-row input::placeholder{color:var(--muted)}
  .refresh-btn{
    background:linear-gradient(90deg,var(--pink),var(--purple));
    border:none;
    color:#fff;
    border-radius:12px;
    padding:0 20px;
    cursor:pointer;
    font-family:'Inter',sans-serif;
    font-weight:700;
    font-size:.9rem;
    letter-spacing:.01em;
    transition:transform .15s,box-shadow .15s,filter .15s;
    box-shadow:0 6px 16px rgba(139,47,247,.28);
    will-change:transform,filter;
  }
  .refresh-btn:hover{transform:translateY(-2px) scale(1.03);filter:brightness(1.06)}
  .refresh-btn:active{transform:translateY(0) scale(.98)}
  .refresh-btn:focus-visible,a:focus-visible,button:focus-visible,input:focus-visible,.card:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

  /* Chips - optimized */
  .chips{display:flex;flex-wrap:wrap;gap:10px}
  .chip{
    position:relative;
    padding:9px 20px;
    border-radius:999px;
    background:var(--surface);
    border:2px dashed var(--accent,var(--purple));
    color:var(--accent,var(--purple));
    font-size:.85rem;
    font-weight:700;
    letter-spacing:.02em;
    cursor:pointer;
    transition:transform .18s,background .18s;
    will-change:transform;
  }
  .chip:hover{transform:translateY(-2px) scale(1.04);background:color-mix(in srgb,var(--accent,var(--purple)) 10%,#fff)}
  .chip.active{
    background:var(--accent,var(--purple));
    color:#fff;
    border-style:solid;
    box-shadow:0 8px 18px color-mix(in srgb,var(--accent,var(--purple)) 45%,transparent);
  }
  .chip .count{
    opacity:.75;
    font-family:'JetBrains Mono',monospace;
    font-size:.75rem;
    margin-left:6px;
  }

  /* Grid - optimized */
  .grid-wrap{
    max-width:1180px;
    margin:0 auto;
    padding:20px 40px 90px;
    position:relative;
    z-index:2;
    contain:content;
  }
  .cat-heading{
    display:flex;
    align-items:baseline;
    gap:12px;
    font-family:'Bebas Neue',sans-serif;
    letter-spacing:.05em;
    font-size:1.6rem;
    color:var(--accent,var(--purple));
    margin:38px 0 16px;
  }
  .cat-heading::after{
    content:"";
    flex:1;
    height:3px;
    border-radius:3px;
    background:repeating-linear-gradient(to right,var(--accent,var(--purple)) 0 8px,transparent 8px 14px);
    opacity:.5;
  }
  .cat-heading:first-child{margin-top:6px}
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(212px,1fr));
    gap:22px;
    contain:content;
  }
  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    overflow:hidden;
    cursor:pointer;
    transition:transform .2s cubic-bezier(.34,1.56,.64,1),box-shadow .2s,border-color .2s;
    opacity:0;
    transform:translateY(16px);
    animation:cardIn .5s ease forwards;
    animation-delay:calc(var(--i,0)*45ms);
    border-bottom:4px solid var(--accent,var(--purple));
    will-change:transform,box-shadow;
  }
  @keyframes cardIn{to{opacity:1;transform:translateY(0)}}
  @media (prefers-reduced-motion:reduce){.card{animation:none;opacity:1;transform:none}}
  .card:hover,.card:focus-visible{
    transform:translateY(-6px) scale(1.02);
    box-shadow:0 18px 34px color-mix(in srgb,var(--accent,var(--purple)) 30%,transparent),0 0 0 1px var(--accent,var(--purple));
  }

  /* Poster - optimized */
  .poster{
    position:relative;
    aspect-ratio:16/9;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    background:linear-gradient(135deg,color-mix(in srgb,var(--accent,var(--purple)) 18%,var(--surface-2)),var(--surface-2));
    padding:9px 0;
    contain:strict;
  }
  .poster::before,.poster::after{
    content:"";
    position:absolute;
    left:0;right:0;
    height:9px;
    background-color:var(--surface-2);
    background-image:radial-gradient(circle,var(--surface) 3px,transparent 3.2px);
    background-size:18px 9px;
    background-position:center;
    z-index:2;
  }
  .poster::before{top:0}
  .poster::after{bottom:0}
  .poster img{
    width:100%;height:100%;object-fit:cover;
    transition:transform .35s;
    will-change:transform;
  }
  .card:hover .poster img{transform:scale(1.08)}
  .poster .initials{
    font-family:'Bebas Neue',sans-serif;
    font-size:2.6rem;
    letter-spacing:.05em;
    color:var(--accent,var(--purple));
    opacity:.35;
  }
  .poster .play{
    position:absolute;inset:0;
    display:flex;align-items:center;justify-content:center;
    background:rgba(28,16,48,0);
    transition:background .18s;
  }
  .card:hover .play{background:rgba(28,16,48,.35)}
  .play svg circle{fill:var(--accent,var(--purple))}
  .play svg{
    width:48px;height:48px;
    opacity:0;
    transform:scale(.7);
    transition:.2s;
    filter:drop-shadow(0 4px 12px rgba(0,0,0,.35));
    will-change:opacity,transform;
  }
  .card:hover .play svg{opacity:1;transform:scale(1);animation:pulse 1.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
  .format-badge{
    position:absolute;
    top:14px;
    right:8px;
    background:rgba(255,255,255,.92);
    border:1px solid var(--line);
    color:var(--ink);
    font-family:'JetBrains Mono',monospace;
    font-size:.65rem;
    font-weight:700;
    letter-spacing:.04em;
    padding:3px 7px;
    border-radius:6px;
    text-transform:uppercase;
    pointer-events:none;
    z-index:3;
  }
  .format-badge.mkv{background:var(--pink);border-color:var(--pink);color:#fff}
  .card-body{padding:12px 14px 14px}
  .card-title{
    font-size:.93rem;
    font-weight:700;
    line-height:1.3;
    margin:0 0 6px;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }
  .card-meta{
    font-family:'JetBrains Mono',monospace;
    font-size:.72rem;
    color:var(--muted);
    display:flex;
    justify-content:space-between;
  }
  .card-meta span:first-child{color:var(--accent,var(--purple));font-weight:600}

  /* Empty state - optimized */
  .empty{
    text-align:center;
    padding:80px 20px;
    color:var(--muted);
  }
  .empty svg{width:60px;height:60px;opacity:.6;margin-bottom:16px;color:var(--pink);animation:spin 6s linear infinite;will-change:transform}
  @media (prefers-reduced-motion:reduce){.empty svg{animation:none}}
  .empty h2{
    font-family:'Bebas Neue',sans-serif;
    letter-spacing:.04em;
    color:var(--ink);
    font-size:1.6rem;
    margin:0 0 8px;
  }
  .empty code{
    background:var(--surface-2);
    padding:2px 7px;
    border-radius:6px;
    font-family:'JetBrains Mono',monospace;
  }
  @keyframes spin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}

  /* Modal - optimized */
  .modal-overlay{
    position:fixed;inset:0;
    background:rgba(28,16,48,.72);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:100;
    padding:24px;
  }
  .modal-overlay.open{display:flex;animation:fadeIn .2s ease;will-change:opacity}
  @keyframes fadeIn{0%{opacity:0}100%{opacity:1}}
  .modal{width:100%;max-width:960px}

    justify-content:space-between;
    align-items:center;
    margin-bottom:12px;
    gap:16px;
  }
  .modal-head h3{
    font-family:'Bebas Neue',sans-serif;
    letter-spacing:.03em;
    font-size:1.7rem;
    background:linear-gradient(90deg,var(--pink),var(--blue));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    margin:0;
  }
  .modal-close{
    background:var(--surface);
    border:2px solid var(--line);
    color:var(--ink);
    width:40px;height:40px;
    border-radius:50%;
    cursor:pointer;
    flex-shrink:0;
    font-size:1.1rem;
    line-height:1;
    transition:.15s;
    will-change:transform,color,border-color;
  }
  .modal-close:hover{border-color:var(--pink);color:var(--pink);transform:rotate(90deg)}
  .screen{
    position:relative;
    border-radius:var(--radius);
    overflow:hidden;
    background:#000;
    box-shadow:0 24px 60px rgba(28,16,48,.45);
  }
  video{
    width:100%;
    display:block;
    background:#000;
    max-height:78vh;
  }
  .curtain{
    position:absolute;
    top:0;bottom:0;
    width:50%;
    z-index:2;
    background-image:repeating-linear-gradient(90deg,var(--pink) 0 14px,var(--purple) 14px 28px,var(--blue) 28px 42px,var(--green) 42px 56px,var(--yellow) 56px 70px,var(--orange) 70px 84px);
    box-shadow:inset 0 0 40px rgba(0,0,0,.35);
    transition:transform .8s cubic-bezier(.65,0,.35,1);
    will-change:transform;
  }
  .curtain-left{left:0;transform:translateX(0%)}
  .curtain-right{right:0;transform:translateX(0%)}
  .screen.open .curtain-left{transform:translateX(-102%)}
  .screen.open .curtain-right{transform:translateX(102%)}
  @media (prefers-reduced-motion:reduce){.curtain{transition:none}}
  .video-warning{
    display:none;
    align-items:flex-start;
    gap:10px;
    background:color-mix(in srgb,var(--pink) 12%,#fff);
    border:1px solid color-mix(in srgb,var(--pink) 45%,#fff);
    color:#9a1145;
    border-radius:12px;
    padding:12px 14px;
    font-size:.85rem;
    line-height:1.4;
    margin-top:12px;
  }
  .video-warning.show{display:flex}
  .video-warning svg{width:20px;height:20px;flex-shrink:0;margin-top:1px}
  .video-warning a{color:var(--purple);text-decoration:underline}

  /* Footer - optimized */
  footer{
    position:relative;
    z-index:2;
    text-align:center;
    padding:24px;
    color:var(--muted);
    font-size:.78rem;
    border-top:1px solid var(--line);
  }
  footer code{
    background:var(--surface-2);
    padding:2px 6px;
    border-radius:5px;
    font-family:'JetBrains Mono',monospace;
  }
  @media (max-width:560px){
    .search-row{flex-direction:column}
    .controls,.grid-wrap{padding-left:20px;padding-right:20px}
    .marquee{padding-left:24px;padding-right:24px}
  }
</style>
</head>

  </div>
